[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banaperp"
version = "0.1.0"
description = "Perpetual trading SDK for Solana — peel the market, go long or short."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nujar00t", email = "teraziminoka@gmail.com" }]
keywords = ["solana", "perpetual", "trading", "defi", "sdk", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[project.scripts]
banaperp = "banaperp.cli:main"

[project.urls]
Homepage = "https://github.com/nujar00t/banaperp"
Repository = "https://github.com/nujar00t/banaperp"
Issues = "https://github.com/nujar00t/banaperp/issues"

[tool.hatch.build.targets.wheel]
packages = ["banaperp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
